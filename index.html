<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#183c35"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Wild World — Дикий мир</title>
<style>
*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#a8dfc6;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block}
.top{position:fixed;z-index:2;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;color:white;background:linear-gradient(#102c26d9,transparent);font-weight:900;text-shadow:0 2px 4px #173b32}.top small{display:block;font-size:9px;letter-spacing:3px}.stats{background:#153d32d9;border-radius:15px;padding:7px 12px}
.quest{position:fixed;top:78px;left:14px;width:min(260px,68vw);padding:12px 14px;border-radius:14px;background:#fff9e9e8;color:#25473a;box-shadow:0 5px 20px #25473a25}.quest b{display:block;font-size:11px;color:#658b55;letter-spacing:1px}.quest span{display:block;font-weight:800;margin:4px 0}.quest small{font-size:11px;opacity:.75}.hint{position:fixed;top:85px;right:14px;max-width:36vw;color:white;text-align:right;font-size:12px;text-shadow:0 2px 5px #204a3a}
.controls{position:fixed;bottom:22px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-end;z-index:3}.pad{width:118px;height:118px;border-radius:50%;background:#173e3455;border:2px solid #ffffff70;position:relative}.stick{position:absolute;left:33px;top:33px;width:48px;height:48px;border-radius:50%;background:#fffde6d9;border:2px solid white;pointer-events:none}.actions{display:flex;flex-direction:column;gap:10px;align-items:center}button{border:2px solid #fff9;border-radius:50%;width:68px;height:68px;background:#f6c95e;color:#254536;font-weight:900;box-shadow:0 5px 0 #a17c2c;touch-action:none}#run{width:54px;height:54px;background:#f4f0d9;font-size:12px}.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:#153d32e8;color:white;font-weight:700;font-size:13px;opacity:0;z-index:5;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}
</style></head><body><div id="game"></div><div class="top"><div>🌿 WILD WORLD<small>ДИКИЙ МИР</small></div><div class="stats">🫐 <span id="berries">0</span>/5　⭐ <span id="coins">0</span></div></div>
<div class="quest" id="quest"><b>ЗАДАНИЕ 1</b><span>Собери 5 ягод в лесу</span><small>Найди синие ягоды на поляне</small></div><div class="hint" id="hint">Исследуй поляну!</div>
<div class="controls"><div class="pad" id="pad"><div class="stick" id="stick"></div></div><div class="actions"><button id="interact">Взять</button><button id="run">Бег</button></div></div><div class="toast" id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a8dfc6');scene.fog=new THREE.Fog('#a8dfc6',25,65);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6fff3,0x63865a,2));const sun=new THREE.DirectionalLight(0xfff2d5,2.3);sun.position.set(-8,16,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});const grass=M('#77bd78'),green=M('#348b5e'),green2=M('#56aa68'),brown=M('#80553c'),orange=M('#df8d4c'),cream=M('#fff0c8'),blue=M('#3e78d2'),gold=M('#f5c857'),stone=M('#a4b2a0');
function mesh(g,m,x,y,z,parent=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function ball(r,m,x,y,z,sx=1,sy=1,sz=1,parent=scene){const o=mesh(new THREE.SphereGeometry(r,16,12),m,x,y,z,parent);o.scale.set(sx,sy,sz);return o}
const floor=mesh(new THREE.PlaneGeometry(100,100),grass,0,-.08,0);floor.rotation.x=-Math.PI/2;
for(let i=0;i<42;i++){let x=(Math.random()-.5)*46,z=(Math.random()-.5)*46;const p=mesh(new THREE.CircleGeometry(1+Math.random()*2,18),Math.random()>.5?M('#88ca7e'):M('#6db474'),x,.005,z);p.rotation.x=-Math.PI/2;p.scale.set(1+Math.random(),.7+Math.random(),1)}
const path=M('#d9c18a');for(let i=0;i<18;i++){let p=mesh(new THREE.CircleGeometry(1.05,18),path,-12+i*1.45,.018,4+Math.sin(i*.34)*2);p.rotation.x=-Math.PI/2;p.scale.set(1.45,.78,1)}
for(let i=0;i<55;i++){let x=(Math.random()-.5)*44,z=(Math.random()-.5)*42;if(Math.abs(x)<5&&Math.abs(z)<5)continue;if(z>1&&z<7&&x>-14&&x<12)continue;mesh(new THREE.CylinderGeometry(.22,.28,1.5,7),brown,x,.7,z);ball(1.1,Math.random()>.5?green:green2,x,1.9,z,1,1.05,1);ball(.75,green2,x-.4,2.15,z+.1)}
for(let i=0;i<28;i++){let x=(Math.random()-.5)*34,z=(Math.random()-.5)*32;if(Math.abs(x)<4&&Math.abs(z)<4)continue;ball(.22+Math.random()*.25,stone,x,.13,z,1.3,.7,1)}
for(let i=0;i<50;i++){let x=(Math.random()-.5)*38,z=(Math.random()-.5)*36;mesh(new THREE.CylinderGeometry(.025,.04,.22,5),green,x,.12,z);ball(.11,M(['#f4d96b','#f7f0d8','#e8a8c3'][i%3]),x,.25,z,.8,.65,.8)}
// Little cottage and door
mesh(new THREE.BoxGeometry(3.4,2.3,2.8),M('#e9d4a8'),-1,1.1,-8);const roof=mesh(new THREE.ConeGeometry(2.55,1.65,4),M('#bd704d'),-1,3.05,-8);roof.rotation.y=Math.PI/4;mesh(new THREE.BoxGeometry(.65,1.2,.08),brown,-1,.6,-6.56);mesh(new THREE.BoxGeometry(.75,.9,.1),M('#8ac8dd'),.05,1.15,-6.55);
// Player fox
const player=new THREE.Group();scene.add(player);ball(.48,orange,0,.58,0,1.05,.85,1.25,player);ball(.38,orange,0,1.05,-.22,1,1,.95,player);ball(.19,cream,0,.91,-.54,1.15,.72,.8,player);
for(const x of [-.23,.23]){const e=mesh(new THREE.ConeGeometry(.14,.36,5),orange,x,1.42,-.25,player);e.rotation.z=x<0?-.2:.2;ball(.045,M('#292f2b'),x*.62,1.1,-.55,1,1,1,player)}
ball(.25,cream,0,.65,.55,1,1,1.8,player);
for(const x of [-.26,.26])mesh(new THREE.BoxGeometry(.16,.42,.18),orange,x,.22,.02,player);player.position.set(0,0,1.5);
// Elder
const elder=new THREE.Group();elder.position.set(1.4,0,-5.7);scene.add(elder);ball(.4,M('#7e9f75'),0,.55,0,1,1.15,.8,elder);ball(.32,M('#e4b58a'),0,1.12,-.05,1,1,1,elder);mesh(new THREE.CylinderGeometry(.3,.42,.16,12),M('#6a7650'),0,1.43,0,elder);const aura=mesh(new THREE.TorusGeometry(.75,.035,6,24),gold,0,.08,0,elder);aura.rotation.x=Math.PI/2;
const spots=[[-5,0],[-9,-3],[4,-5],[8,1],[2,7],[12,-5],[-13,3],[6,10]],berries=[];for(const [x,z] of spots){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);ball(.22,blue,0,.32,0,1,1,.85,g);for(let j=0;j<3;j++)ball(.07,green2,Math.cos(j*2.1)*.16,.16,Math.sin(j*2.1)*.16,1,1,1,g);const ring=mesh(new THREE.TorusGeometry(.34,.035,6,20),gold,0,.06,0,g);ring.rotation.x=Math.PI/2;berries.push({group:g,taken:false})}
let collected=0,coins=0,nearBerry=null,nearElder=false,running=false;const $=s=>document.querySelector(s);function say(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>$('#toast').classList.remove('show'),1800)}function quest(){ $('#quest').innerHTML=collected<5?'<b>ЗАДАНИЕ 1</b><span>Собери 5 ягод в лесу</span><small>Найдено: '+collected+' из 5</small>':'<b>ЗАДАНИЕ 2</b><span>Отнеси ягоды старосте</span><small>Он ждёт возле домика</small>'}quest();
function interact(){if(nearBerry&&!nearBerry.taken){nearBerry.taken=true;nearBerry.group.visible=false;collected++;coins+=2;$('#berries').textContent=collected;$('#coins').textContent=coins;say('Ягода найдена! +2 монеты');quest()}else if(nearElder&&collected>=5){coins+=20;collected=0;berries.forEach(b=>{b.taken=false;b.group.visible=true});$('#berries').textContent='0';$('#coins').textContent=coins;say('Староста благодарит тебя! +20 монет');quest()}else if(nearElder)say('Собери для меня 5 синих ягод!');else say('Подойди поближе к ягоде или старосте')}
$('#interact').addEventListener('click',interact);const keys={};addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[k]=true;if(e.key===' '||k==='e'){if(!e.repeat)interact()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let jx=0,jy=0,pointer=null;const pad=$('#pad'),stick=$('#stick');function setJoy(e){const r=pad.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy)||1;if(l>36){dx=dx/l*36;dy=dy/l*36}jx=dx/36;jy=dy/36;stick.style.transform='translate('+dx+'px,'+dy+'px)'}function reset(){pointer=null;jx=jy=0;stick.style.transform=''}pad.addEventListener('pointerdown',e=>{pointer=e.pointerId;pad.setPointerCapture(pointer);setJoy(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pointer)setJoy(e)});pad.addEventListener('pointerup',reset);pad.addEventListener('pointercancel',reset);$('#run').addEventListener('pointerdown',e=>{e.preventDefault();running=true;$('#run').setPointerCapture?.(e.pointerId)});$('#run').addEventListener('pointerup',()=>running=false);$('#run').addEventListener('pointercancel',()=>running=false);$('#run').addEventListener('lostpointercapture',()=>running=false);addEventListener('blur',()=>{running=false;reset();for(const k in keys)keys[k]=false});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04),x=jx,z=jy;if(keys.a||keys.arrowleft)x--;if(keys.d||keys.arrowright)x++;if(keys.w||keys.arrowup)z--;if(keys.s||keys.arrowdown)z++;let l=Math.hypot(x,z);if(l>1){x/=l;z/=l}if(l>.08){player.position.x+=x*(running?7.2:4.3)*dt;player.position.z+=z*(running?7.2:4.3)*dt;player.rotation.y=Math.atan2(x,z);player.position.x=THREE.MathUtils.clamp(player.position.x,-21,21);player.position.z=THREE.MathUtils.clamp(player.position.z,-20,20);player.position.y=Math.abs(Math.sin(performance.now()*.012))*.04}
nearBerry=null;let closest=1.5;for(const b of berries){if(b.taken)continue;b.group.rotation.y+=dt*.7;let d=Math.hypot(player.position.x-b.group.position.x,player.position.z-b.group.position.z);if(d<closest){closest=d;nearBerry=b}}nearElder=Math.hypot(player.position.x-elder.position.x,player.position.z-elder.position.z)<2.2;$('#hint').textContent=nearBerry?'🫐 Рядом ягода — нажми «Взять»':nearElder?'🧙 Староста — нажми «Взять»':'Исследуй поляну и найди синие ягоды!';
const t=player.position;camera.position.lerp(new THREE.Vector3(t.x,11.5,t.z+13),1-Math.pow(.001,dt));camera.lookAt(t.x,.3,t.z-1);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate();
</script></body></html>
